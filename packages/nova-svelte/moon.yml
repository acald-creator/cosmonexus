layer: library
language: typescript

dependsOn:
  - cm
  - nova-store
  - nova-types
  - prose
  - stellate

tasks:
  build:
    command: bunx svelte-package
    inputs:
      - src/lib/**/*
      - svelte.config.js
      - package.json
    outputs:
      - dist/**/*
    deps:
      - ^:build

  test:
    command: vitest run --passWithNoTests
    inputs:
      - src/**/*
      - vitest.config.ts
    deps:
      - ~:build

  lint:
    command: biome check .
    inputs:
      - src/lib/**/*

  typecheck:
    command: bunx svelte-check --tsconfig ./tsconfig.json
    inputs:
      - src/lib/**/*
      - tsconfig.json
    deps:
      - ^:build
