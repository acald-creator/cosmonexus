$schema: 'https://moonrepo.dev/schemas/workspace.json'

# Project edges live in each moon.yml `dependsOn`. The javascript toolchain is
# off (proto 0.53.1 cannot load the bun plugin), so package.json is not scanned.
projects:
  - 'packages/*'
  - 'apps/*'

vcs:
  client: 'git'
  defaultBranch: 'main'
