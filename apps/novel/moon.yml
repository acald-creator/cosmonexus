layer: application
language: typescript

dependsOn:
  - design-tokens
  - nova-store
  - nova-svelte
  - nova-types
  - prose

tasks:
  dev:
    command: bunx vite dev
    preset: server

  build:
    command: bunx vite build
    inputs:
      - src/**/*
      - svelte.config.js
      - vite.config.ts
      - package.json
    outputs:
      - build/**/*
    deps:
      - ^:build

  lint:
    command: biome check .
    inputs:
      - src/**/*

  typecheck:
    command: bunx svelte-check --tsconfig ./tsconfig.json
    inputs:
      - src/**/*
      - tsconfig.json
    deps:
      - ^:build
