layer: application
language: typescript

dependsOn:
  - design-tokens
  - nova-ui

tasks:
  dev:
    script: 'echo "TODO: configure dev server"'
    options:
      runInCI: false

  lint:
    command: biome check .
    inputs:
      - src/**/*

  typecheck:
    command: tsc --noEmit
    inputs:
      - src/**/*
      - tsconfig.json
    deps:
      - ^:build
